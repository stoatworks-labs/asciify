  <body>
    <main id="demo">
      <noscript>
        <h1>Asciify</h1>
        <p>
          An ASCII art FFGL effect that picks each character by how much ink the
          cell wants and where that ink sits, so edges get characters that lean
          the right way instead of being flattened into a brightness ramp.
        </p>
        <p>
          This demo runs the plugin's shader in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/asciify/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/asciify/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/asciify/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/asciify">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
