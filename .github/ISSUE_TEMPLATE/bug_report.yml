# Generated by stoatworks-backend/scripts/sync-issue-templates.py — do not edit here.
# Edit the master in stoatworks-backend/issue-templates/ and re-run the sync.
name: Bug report
description: Something in Asciify is broken, crashes, or behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The single most useful thing you can give us is
        **what you did, what you expected, and what actually happened** — in that
        order. Everything else below is a bonus.

        If this is a security problem, please don't file it here — use the private
        advisory form linked from "New issue" instead.

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of Asciify you're running, and where you got it.
      placeholder: "v0.3.1, downloaded from the releases page"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Linux
        - Embedded / on-device
        - Other or not applicable
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the tool did in response.
      placeholder: |
        1. Opened the app and connected to ...
        2. Clicked ...
        3. It froze for ten seconds and then showed "connection reset"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: hardware
    attributes:
      label: Hardware and network in play
      description: >
        Most of these tools talk to something else. Which device, which firmware, and
        how it's connected is often the whole answer — say "not applicable" if this
        one is purely local.
      placeholder: "d&b D80, firmware 2.14, on a flat VLAN with the laptop"

  - type: textarea
    id: log-file
    attributes:
      label: The log file
      description: |
        Asciify writes a plain text log every time it runs, and it is usually the
        difference between "it does nothing" and an answer — almost everything that
        goes wrong in a plugin looks identical from your side, with no message
        anywhere, and the log is where it says which thing it was and what your
        graphics driver had to say about it.

        There is no button to press and no command to run: Asciify is loaded by
        the host, so the log is simply a file already sitting on your disk.

        - **macOS** — `~/Library/Logs/asciify/asciify.YYYY-MM-DD.log`
        - **Windows** — `%LOCALAPPDATA%\asciify\logs\asciify.YYYY-MM-DD.log`

        Attach the file for the day it went wrong, or paste the last few dozen lines
        here. Read it first if you'd rather: it's plain text, and the most identifying
        things in it are file paths and the name of your GPU.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Anything in the log
      description: Error text, a stack trace, or the last few lines before it went wrong.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I'm on the latest release, or I've said above why I can't be.
          required: false
        - label: I've searched the existing issues.
          required: false
